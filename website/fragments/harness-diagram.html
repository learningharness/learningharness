<figure class="harness-diagram system-map" aria-label="LearningHarness architecture: Codex launches reviewed local hooks; a local learning runtime reads selected work through Codex App Server, prepares content using the existing model connection, and serves an HTML app through MCP inside Codex's sidebar container.">
  <div class="diagram-connection"><span>ON YOUR COMPUTER</span><span>Three boundaries · two independent agents</span></div>
  <div class="system-map-flow">
    <section class="system-map-lane"><span class="diagram-label">01 / CODEX OWNS THE WORK</span><h3>Your coding chat</h3><p>The coding agent plans, implements and tests. Learning does not block it.</p><div class="system-map-node"><strong>Host lifecycle events</strong><span>SessionStart<br>UserPromptSubmit<br>PostToolUse</span></div><p class="system-map-edge">↓ Codex launches the reviewed hook with the active chat ID.</p></section>
    <section class="system-map-lane system-map-local"><span class="diagram-label">02 / LEARNINGHARNESS RUNS LOCALLY</span><h3>The learning runtime</h3><div class="system-map-node"><strong>Our short-lived hook</strong><span>Marks activity and signals readiness.<br>No lesson generation in the hook.</span></div><p class="system-map-edge">↓ Activity marker → independent learning service</p><div class="system-map-node"><strong>Our local Node.js service</strong><span>Selected work + learning goals + memory<br>Relevance, budgets, tools and saved lessons</span></div><p class="system-map-edge">↓ Our MCP server serves the app; actions return through the bridge.</p></section>
    <section class="system-map-lane"><span class="diagram-label">03 / CODEX HOSTS THE VIEW</span><h3>The learning sidebar</h3><div class="system-map-host"><strong>Codex-owned container</strong><span>Tab, gray app-card header, expand/close controls and embedded frame</span><div class="system-map-app"><strong>LearningHarness-owned web UI</strong><span>HTML · CSS · JavaScript · SolidJS</span><span>Orange invitation, lessons, decks, quizzes, visuals, composer and settings</span></div></div><p class="system-map-edge">Click orange topic → request expansion → open its saved lesson beside the work.</p></section>
  </div>
  <div class="system-map-connections">
    <div><span class="diagram-label">OBSERVATION + MODEL CONNECTION</span><p><b>Our local runtime ⇄ local Codex App Server ⇄ OpenAI model service</b></p><p>The App Server reads selected visible coding context. Separate learning requests use your existing Codex sign-in and additional allowance. They do not prompt your main coding chat.</p></div>
    <div><span class="diagram-label">LOCAL STATE</span><p><b>Goals · answers · drafts · review history · prepared lessons</b></p><p>Saved on your device. Relevant parts can be included in learning requests. Card flips and other deterministic controls run without new model calls.</p></div>
  </div>
  <figcaption>The plugin is a local application with an embedded web interface, not native macOS learning widgets. Codex owns the surrounding container; we own the content inside it. Prepared invitations still depend on a later hook and the coding agent calling the launcher. No LearningHarness-hosted inference backend; opt-out usage metadata goes separately to PostHog.</figcaption>
</figure>
